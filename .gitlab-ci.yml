# GitLab CI configuration for thorn

stages:
  - test

test-job:
  stage: test
  tags:
    - thorn-agent
  variables:
    GIT_STRATEGY: none
  script:
    - python --version
    - |
      python - <<'PY'
      import os
      import socket
      import ssl

      host = "gitlab-master.nvidia.com"
      ports = [443, 5005]

      print("Proxy-related environment:")
      for key in sorted(os.environ):
          if key.lower() in {"http_proxy", "https_proxy", "no_proxy"}:
              print(f"  {key}={os.environ[key]}")

      print("\n/etc/resolv.conf:")
      try:
          print(open("/etc/resolv.conf", encoding="utf-8").read())
      except OSError as e:
          print(f"  unable to read: {e}")

      print(f"\nDNS lookup for {host}:")
      try:
          infos = socket.getaddrinfo(host, None, proto=socket.IPPROTO_TCP)
          addrs = sorted({info[4][0] for info in infos})
          for addr in addrs:
              print(f"  {addr}")
      except OSError as e:
          print(f"  FAILED: {e}")
          raise SystemExit(1)

      for port in ports:
          print(f"\nTCP connect to {host}:{port}:")
          try:
              with socket.create_connection((host, port), timeout=10) as sock:
                  print("  OK")
          except OSError as e:
              print(f"  FAILED: {e}")
              continue

          print(f"TLS handshake to {host}:{port}:")
          try:
              ctx = ssl.create_default_context()
              with socket.create_connection((host, port), timeout=10) as raw:
                  with ctx.wrap_socket(raw, server_hostname=host) as tls:
                      print(f"  OK: {tls.version()} {tls.cipher()[0]}")
                      tls.sendall(f"HEAD / HTTP/1.1\r\nHost: {host}\r\nConnection: close\r\n\r\n".encode())
                      response = tls.recv(512).decode("iso-8859-1", errors="replace")
                      print("  HTTP response:")
                      print("  " + response.splitlines()[0])
          except OSError as e:
              print(f"  FAILED: {e}")
      PY

