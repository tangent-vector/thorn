# All-in-container deployment: Thorn gateway + OneCLI broker stack.
#
#     docker compose -f deploy/all-in-container.compose.yml up --build
#
# This file is the OPTIONAL Mode B deployment (see
# ``deploy/broker.compose.yml`` for Mode A, which is the
# recommended default).  Use this when you want the Thorn gateway
# to run inside a container alongside the broker, e.g. on a host
# whose only role is "run Thorn" and where you'd rather not have
# the gateway as a host process.
#
# Trade-offs to be aware of before choosing this mode:
#
# * The gateway needs to launch per-agent sandbox containers via
#   the host's OCI runtime.  The way it does that here is by
#   bind-mounting the host's Docker socket
#   (``/var/run/docker.sock``) into the gateway container.  This is
#   *Docker-out-of-Docker* (DooD), not Docker-in-Docker (DinD).
#   The mechanism is well-supported but it gives the gateway
#   container effective root on the host: anything the gateway
#   process can do, anything inside the gateway container can do
#   to the host's Docker daemon (launch privileged containers,
#   mount arbitrary host paths, ...).  This is acceptable for
#   single-tenant operator-controlled deployments; do not run this
#   mode on a host where the gateway is exposed to untrusted
#   input that could compromise the gateway process.
#
# * Mode A (gateway as host process, broker in compose) avoids the
#   socket mount entirely and is strictly simpler.  Prefer it
#   unless you have a concrete reason to want the gateway in a
#   container.
#
# Layered on top of the broker stack via ``include:``: the broker,
# Postgres, networks, and volumes are defined in
# ``deploy/broker.compose.yml`` and inherited verbatim.

include:
  - broker.compose.yml

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      GIT_AUTHOR_NAME: thorn-bot
      GIT_COMMITTER_NAME: thorn-bot
      GIT_AUTHOR_EMAIL: thorn-bot@users.noreply.github.com
      GIT_COMMITTER_EMAIL: thorn-bot@users.noreply.github.com
    volumes:
      - ../.thorn:/workspace/.thorn
      # Docker-out-of-Docker: the gateway uses the host's Docker
      # daemon to launch per-agent sandbox sibling containers.
      # See header comment for the privilege trade-off.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      # ``thorn-default`` so the gateway can reach the LLM
      # provider and forge upstreams over the internet;
      # ``thorn-broker`` so it can reach OneCLI by service name
      # at ``http://onecli:10254``.  Set this matching URL in
      # ``.thorn/gateway.json``'s broker block when running in
      # this mode (Mode A uses ``http://127.0.0.1:10254``).
      - thorn-default
      - thorn-broker
    restart: unless-stopped
