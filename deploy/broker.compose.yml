# OneCLI credential broker stack -- deployment-mode-agnostic.
#
#     docker compose -f deploy/broker.compose.yml up -d
#
# This file brings up the broker (the OneCLI Rust gateway + Next.js
# admin/dashboard) and its Postgres on a stable Docker network named
# ``thorn-broker``.  It does NOT start the Thorn gateway and makes no
# assumption about how the gateway runs:
#
# * Mode A (recommended for VMs): Thorn gateway runs as a host process.
#   It reaches the broker's admin API via the published localhost port
#   (``http://127.0.0.1:10254``) and fetches the CA over HTTP.  When
#   the gateway launches per-agent sandbox containers it tells the
#   local OCI runtime to attach them to ``thorn-broker``; they then
#   reach OneCLI's substitution proxy by DNS name (``onecli:10255``).
#
# * Mode B (alternative): Thorn gateway runs as a sibling container
#   composed via ``deploy/all-in-container.compose.yml``, which uses
#   ``include:`` to layer this broker stack underneath a gateway
#   service that mounts the host's Docker socket.  See that file for
#   the trade-offs.
#
# The ``thorn-broker`` network is created with ``internal: true`` so
# any container attached to it (sandbox containers in particular)
# has no NAT to the host network and therefore cannot reach the
# internet directly -- the only reachable destination is the broker.
# This is the Phase D "broker-only" egress policy without any
# iptables work in Thorn.  OneCLI itself joins both ``thorn-broker``
# (so sandboxes can reach it) and a second non-internal network
# (``thorn-default``) so the substitution proxy can forward requests
# to upstream APIs.
#
# The CA cert acquisition is handled entirely by the Thorn gateway
# at startup via ``GET /api/gateway/ca``.  No Docker volume needs to
# be shared between OneCLI and the gateway for this; OneCLI's
# generated CA stays in its own ``/app/data`` and the gateway writes
# its local copy under ``<agency_home>/onecli-ca.pem`` (or wherever
# ``broker.ca_certificate_path`` in ``gateway.json`` says).
#
# Environment variables (all optional with sensible defaults; see
# deploy/brev/env.template for the canonical list):
#   ONECLI_BIND_HOST          IP to bind the published ports to
#                             (default 127.0.0.1).  Set to 0.0.0.0
#                             only on hosts behind separate auth.
#   ONECLI_POSTGRES_USER      default 'onecli'
#   ONECLI_POSTGRES_PASSWORD  default 'onecli'  (set on shared hosts)
#   ONECLI_POSTGRES_DB        default 'onecli'
#   ONECLI_NEXTAUTH_SECRET    NextAuth session-signing secret.
#                             Generate with ``openssl rand -hex 32``.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${ONECLI_POSTGRES_USER:-onecli}
      POSTGRES_PASSWORD: ${ONECLI_POSTGRES_PASSWORD:-onecli}
      POSTGRES_DB: ${ONECLI_POSTGRES_DB:-onecli}
    volumes:
      - onecli-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ONECLI_POSTGRES_USER:-onecli}"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks:
      # Postgres serves only the OneCLI app and is on the broker
      # network only.  Keeping it off ``thorn-default`` reduces the
      # broker database's external exposure to zero.
      - thorn-broker
    restart: unless-stopped

  onecli:
    image: ghcr.io/onecli/onecli:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Admin API: the Thorn gateway (host or container) talks to
      # this.  Bind to localhost so the dashboard isn't accidentally
      # exposed on the host's external interfaces.
      - "${ONECLI_BIND_HOST:-127.0.0.1}:10254:10254"
      # Substitution proxy: published for debugging convenience,
      # but normal operation routes sandbox traffic through the
      # Docker network rather than the published port.
      - "${ONECLI_BIND_HOST:-127.0.0.1}:10255:10255"
    environment:
      DATABASE_URL: postgresql://${ONECLI_POSTGRES_USER:-onecli}:${ONECLI_POSTGRES_PASSWORD:-onecli}@postgres:5432/${ONECLI_POSTGRES_DB:-onecli}
      NEXTAUTH_SECRET: ${ONECLI_NEXTAUTH_SECRET:-}
      NEXT_PUBLIC_APP_URL: http://${ONECLI_BIND_HOST:-127.0.0.1}:10254
      APP_URL: http://${ONECLI_BIND_HOST:-127.0.0.1}:10254
    volumes:
      - onecli-app-data:/app/data
    networks:
      # OneCLI must serve the broker network (so sandboxes can
      # reach it) AND have outbound to ``thorn-default`` so its
      # substitution proxy can forward requests to upstream APIs
      # after credential injection.
      - thorn-default
      - thorn-broker
    restart: unless-stopped

volumes:
  onecli-pgdata:
  onecli-app-data:

networks:
  # Outbound bridge: OneCLI uses this to reach upstream APIs.  Has
  # NAT to the host (the Docker default).  Sandbox containers do
  # NOT join this network.
  thorn-default:
    driver: bridge
    # Pinned name so the all-in-container compose (which include:s
    # this file) and any operator running ``docker network ls``
    # see a stable, project-independent identifier.
    name: thorn-default

  # Sandbox-facing internal network: no NAT to the host network,
  # so anything attached to it can reach the broker (which is also
  # attached) and nothing else.  Sandboxes spawned by the Thorn
  # gateway join this network via ``--network thorn-broker`` (the
  # gateway's ``sandbox.egress_network`` setting in gateway.json).
  thorn-broker:
    driver: bridge
    internal: true
    # Pinned name so ``docker run --network thorn-broker`` from
    # the host gateway (Mode A) finds the right network regardless
    # of the compose project name.
    name: thorn-broker
