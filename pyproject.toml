[project]
name = "thorn"
version = "0.1.0"
description = "A lightweight agent harness that unifies Python functions, prompt-based skills, and tools."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "docstring-parser>=0.16",
    "pathspec>=0.12",
    "psutil>=5.9",
    "mistletoe>=1.4",
    "PyYAML>=6.0",
]

[project.scripts]
thorn = "thorn._cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
mcp = ["mcp>=1.0"]
gitlab = ["python-gitlab>=5.0"]
github = ["PyGithub>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/thorn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "requires_podman: smoke test that talks to a real podman; opt-in only",
    "requires_docker: smoke test that talks to a real docker; opt-in only",
]
# Smoke tests against real OCI runtimes are opt-in: developers should not
# pay 20s of container churn on every ``uv run pytest``.  Run them
# explicitly via ``pytest -m requires_podman`` (or ``-m requires_docker``,
# or ``-m 'requires_podman or requires_docker'``).
addopts = "-m 'not requires_podman and not requires_docker'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
