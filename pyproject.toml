[project]
name = "thorn"
version = "0.1.0"
description = "A lightweight agent harness that unifies Python functions, prompt-based skills, and tools."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
thorn = "thorn._cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
mcp = ["mcp>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
