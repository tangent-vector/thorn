[project]
name = "thorn"
version = "0.1.0"
description = "A lightweight agent harness that unifies Python functions, prompt-based skills, and tools."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "docstring-parser>=0.16",
    "pathspec>=0.12",
    "psutil>=5.9",
    "mistletoe>=1.4",
]

[project.scripts]
thorn = "thorn._cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
eval = ["pyyaml>=6.0"]
mcp = ["mcp>=1.0"]
gitlab = ["python-gitlab>=5.0"]
github = ["PyGithub>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/thorn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
